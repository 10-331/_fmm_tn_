<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>You & Me</title>
  <style>
    :root{
      --bg:#f7f4ee; --card:#fffdf8; --ink:#4a4742; --muted:#918a82; --line:#ded6ca;
      --chip:#eee8df; --accent:#4a4742; --soft:#eee6dc; --shadow:0 14px 40px rgba(74,71,66,.08);
    }
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family: ui-serif, Georgia, 'Times New Roman', 'Hiragino Mincho ProN', 'Yu Mincho', serif;}
    button,input,textarea{font:inherit;color:inherit} button{border:0;cursor:pointer}
    .app{max-width:760px;margin:0 auto;padding:72px 18px 112px;}
    .hero{text-align:center;padding:32px 0 44px;border-bottom:1px solid var(--line)}
    .sub{letter-spacing:.22em;color:var(--muted);font-size:16px;margin-bottom:22px}.title{font-size:64px;line-height:1;font-weight:700;margin:0 0 28px}.date{font-family:ui-sans-serif, system-ui, sans-serif;color:var(--muted);font-size:18px;letter-spacing:.05em}.label{font-family:ui-sans-serif, system-ui, sans-serif;color:var(--muted);font-size:14px;letter-spacing:.18em;margin:38px 0 18px}.headline{font-size:28px;line-height:1.5;margin:0}.quote{color:#b6aa9d}.actions{display:flex;gap:14px;margin:34px 0 26px;flex-wrap:wrap}.btn{font-family:ui-sans-serif, system-ui, sans-serif;font-weight:700;border-radius:999px;padding:14px 20px;background:var(--chip)}.btn.primary{background:var(--accent);color:white}.btn.small{padding:10px 14px;font-size:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:24px;margin:18px 0;box-shadow:var(--shadow)}
    h2{font-size:34px;margin:0 0 22px;}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.stat{background:var(--soft);border-radius:24px;padding:18px;min-height:128px}.stat .name{font-family:ui-sans-serif,system-ui,sans-serif;color:var(--muted);font-size:15px}.stat .value{font-family:ui-sans-serif,system-ui,sans-serif;font-weight:800;font-size:34px;letter-spacing:.02em;margin-top:14px}.stat .unit{font-size:17px;color:var(--muted);margin-left:4px}.stat .note{font-family:ui-sans-serif,system-ui,sans-serif;color:var(--muted);font-size:14px;line-height:1.6;margin-top:8px}.section-title{display:flex;align-items:center;gap:10px}.textblock{white-space:pre-wrap;line-height:1.9;font-size:17px}.meal-row{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid rgba(222,214,202,.55)}.meal-row:last-child{border-bottom:0}.meal-name{font-family:ui-sans-serif,system-ui,sans-serif;color:var(--muted);font-weight:700}.bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(247,244,238,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:12px 18px max(12px,env(safe-area-inset-bottom));display:flex;justify-content:center;gap:10px}.tab{font-family:ui-sans-serif,system-ui,sans-serif;font-weight:800;color:var(--muted);border-radius:999px;padding:12px 18px;background:transparent}.tab.active{background:var(--accent);color:white}.view{display:none}.view.active{display:block}.list-item{padding:18px;border-bottom:1px solid var(--line)}.list-item button{text-align:left;background:transparent;width:100%}.list-date{font-family:ui-sans-serif,system-ui,sans-serif;color:var(--muted);font-weight:700}.list-head{font-size:22px;margin-top:6px}.modal{position:fixed;inset:0;background:rgba(20,18,16,.35);z-index:20;display:none;align-items:flex-end}.modal.open{display:flex}.sheet{width:100%;max-width:760px;margin:0 auto;background:var(--card);border-radius:28px 28px 0 0;padding:22px 18px max(26px,env(safe-area-inset-bottom));max-height:86vh;overflow:auto}.form-grid{display:grid;gap:14px}.field label{font-family:ui-sans-serif,system-ui,sans-serif;display:block;color:var(--muted);font-size:13px;font-weight:700;margin:0 0 6px}.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:16px;padding:12px;background:#fffdfa;font-family:ui-sans-serif,system-ui,sans-serif}.field textarea{min-height:88px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--accent);color:white;padding:10px 16px;border-radius:999px;font-family:ui-sans-serif,system-ui,sans-serif;display:none;z-index:30}.toast.show{display:block}.graphbox{height:280px;background:var(--card);border:1px solid var(--line);border-radius:28px;padding:16px}.settings-note{font-family:ui-sans-serif,system-ui,sans-serif;color:var(--muted);line-height:1.8}.danger{background:#f2dddd}.file{font-family:ui-sans-serif,system-ui,sans-serif;}
    @media(max-width:420px){.title{font-size:54px}.app{padding-left:14px;padding-right:14px}.grid{gap:10px}.stat{padding:15px}.stat .value{font-size:30px}h2{font-size:30px}.headline{font-size:25px}}
  </style>
</head>
<body>
  <main class="app">
    <section id="home" class="view active"></section>
    <section id="graph" class="view"></section>
    <section id="history" class="view"></section>
    <section id="settings" class="view"></section>
  </main>
  <nav class="bottom">
    <button class="tab active" data-view="home">ホーム</button><button class="tab" data-view="graph">グラフ</button><button class="tab" data-view="history">履歴</button><button class="tab" data-view="settings">設定</button>
  </nav>
  <div id="modal" class="modal"><div class="sheet" id="sheet"></div></div><div id="toast" class="toast"></div>
<script>
const STORAGE_KEY='you-and-me-data-v1';
const todayISO=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const fmtDate=d=>{const x=new Date(d+'T00:00:00');return `${x.getFullYear()}.${String(x.getMonth()+1).padStart(2,'0')}.${String(x.getDate()).padStart(2,'0')} ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][x.getDay()]}`};
let data={settings:{appName:'You & Me',subtitle:'a small record of ordinary days',icons:{summary:'⚖️',meals:'🍴',memo:'📝',review:'🤖'}},records:[]};
let currentDate=todayISO();
async function load(){const saved=localStorage.getItem(STORAGE_KEY);if(saved){data=JSON.parse(saved);return;}try{const res=await fetch('./data.json',{cache:'no-store'});if(res.ok){data=await res.json();save(false);}}catch(e){} ensureDate(todayISO());}
function save(show=true){localStorage.setItem(STORAGE_KEY,JSON.stringify(data));if(show)toast('保存しました');}
function ensureDate(date){let r=data.records.find(x=>x.date===date);if(!r){r={date,headline:'',weights:[],steps:'',distanceKm:'',meals:{breakfast:'',lunch:'',dinner:'',snack:'',other:''},lifeMemo:'',chatgptSummary:'',aiReview:''};data.records.push(r);save(false);}return r;}
function latestWeight(r){return (r.weights||[]).slice().sort((a,b)=>(a.time||'').localeCompare(b.time||'')).at(-1)}
function weightChangeText(r){const base=data.records.find(x=>x.date==='2026-05-01');const bw=base&&latestWeight(base);const lw=latestWeight(r);if(!bw||!lw)return '—';const diff=(lw.value-bw.value).toFixed(1);return `${diff>0?'+':''}${diff} kg`;}
function render(){renderHome();renderGraph();renderHistory();renderSettings();}
function renderHome(){const r=ensureDate(currentDate);const w=latestWeight(r);document.getElementById('home').innerHTML=`
  <div class="hero"><div class="sub">${esc(data.settings.subtitle)}</div><h1 class="title">${esc(data.settings.appName)}</h1><div class="date">${fmtDate(r.date)}</div><div class="label">今日の一行</div><p class="headline"><span class="quote">“</span>${esc(r.headline||'まだ何も書いていない')}<span class="quote">”</span></p></div>
  <div class="actions"><button class="btn primary" onclick="openEdit('${r.date}')">今日を編集</button><button class="btn" onclick="openWeight('${r.date}')">体重追加</button><button class="btn" onclick="copyRecord('${r.date}')">全文コピー</button></div>
  <section class="card"><h2 class="section-title"><span>${data.settings.icons.summary}</span>今日の記録</h2><div class="grid">
    <div class="stat"><div class="name">体重</div><div class="value">${w?Number(w.value).toFixed(1):'—'}<span class="unit">kg</span></div><div class="note">${w?`${r.date}<br>${esc(w.time||'')}`:''}</div></div>
    <div class="stat"><div class="name">歩数</div><div class="value">${r.steps?Number(r.steps).toLocaleString():'—'}<span class="unit">steps</span></div></div>
    <div class="stat"><div class="name">距離</div><div class="value">${r.distanceKm||'—'}<span class="unit">km</span></div></div>
    <div class="stat"><div class="name">体重変化</div><div class="value">${esc(weightChangeText(r))}</div><div class="note">5/1から</div></div>
  </div></section>
  <section class="card"><h2 class="section-title"><span>${data.settings.icons.meals}</span>今日の食事</h2>${mealRows(r)}</section>
  <section class="card"><h2 class="section-title"><span>${data.settings.icons.memo}</span>生活メモ</h2><div class="textblock">${esc(r.lifeMemo||'—')}</div></section>
  <section class="card"><h2>ChatGPT振り返り</h2><div class="textblock">${esc(r.chatgptSummary||'—')}</div></section>
  <section class="card"><h2 class="section-title"><span>${data.settings.icons.review}</span>AI評価</h2><div class="textblock">${esc(r.aiReview||'—')}</div></section>`;}
function mealRows(r){const m=r.meals||{};return [['朝','breakfast'],['昼','lunch'],['夜','dinner'],['間食','snack'],['その他','other']].map(([n,k])=>`<div class="meal-row"><div class="meal-name">${n}</div><div class="textblock">${esc(m[k]||'—')}</div></div>`).join('')}
function renderHistory(){const rows=data.records.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(r=>`<div class="list-item"><button onclick="currentDate='${r.date}';showView('home');render();"><div class="list-date">${fmtDate(r.date)}</div><div class="list-head">${esc(r.headline||'—')}</div></button></div>`).join('');document.getElementById('history').innerHTML=`<div class="hero"><div class="sub">records</div><h1 class="title">History</h1></div><section class="card">${rows}</section>`}
function renderGraph(){const recs=data.records.slice().sort((a,b)=>a.date.localeCompare(b.date)).filter(r=>latestWeight(r));document.getElementById('graph').innerHTML=`<div class="hero"><div class="sub">weight graph</div><h1 class="title">Graph</h1></div><section class="card"><div class="graphbox"><canvas id="chart" width="680" height="260"></canvas></div></section><section class="card"><h2>体重ログ</h2><div class="textblock">${recs.map(r=>`${r.date}：${latestWeight(r).value}kg`).join('\n')||'—'}</div></section>`;setTimeout(()=>drawChart(recs),0)}
function drawChart(recs){const c=document.getElementById('chart');if(!c||recs.length===0)return;const ctx=c.getContext('2d'),W=c.width,H=c.height,p=34;ctx.clearRect(0,0,W,H);const vals=recs.map(r=>Number(latestWeight(r).value));const min=Math.min(...vals)-1,max=Math.max(...vals)+1;ctx.strokeStyle='#ded6ca';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(p,H-p);ctx.lineTo(W-p,H-p);ctx.lineTo(W-p,p);ctx.stroke();const xy=(v,i)=>[p+(W-2*p)*(recs.length===1?.5:i/(recs.length-1)),H-p-(H-2*p)*((v-min)/(max-min||1))];ctx.strokeStyle='#4a4742';ctx.lineWidth=3;ctx.beginPath();vals.forEach((v,i)=>{const [x,y]=xy(v,i);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();vals.forEach((v,i)=>{const [x,y]=xy(v,i);ctx.fillStyle='#4a4742';ctx.beginPath();ctx.arc(x,y,5,0,Math.PI*2);ctx.fill();ctx.font='18px system-ui';ctx.fillText(v.toFixed(1),x-18,y-12);});}
function renderSettings(){document.getElementById('settings').innerHTML=`<div class="hero"><div class="sub">settings</div><h1 class="title">Settings</h1></div><section class="card"><h2>バックアップ</h2><p class="settings-note">全記録は1つの data.json 形式で扱います。GitHubに置く場合も、基本はこの1ファイルを更新する運用です。</p><div class="actions"><button class="btn primary" onclick="downloadJSON()">data.jsonを保存</button><label class="btn file">data.jsonを読込<input type="file" accept="application/json" onchange="importJSON(event)" hidden></label></div></section><section class="card"><h2>初期化</h2><button class="btn danger" onclick="resetLocal()">ブラウザ保存を削除</button></section>`}
function openEdit(date){const r=ensureDate(date),m=r.meals||{};openSheet(`<h2>${fmtDate(date)}を編集</h2><div class="form-grid">
 <div class="field"><label>今日の一行</label><input id="f-headline" value="${attr(r.headline)}"></div>
 <div class="two"><div class="field"><label>歩数</label><input id="f-steps" inputmode="numeric" value="${attr(r.steps)}"></div><div class="field"><label>距離 km</label><input id="f-distance" inputmode="decimal" value="${attr(r.distanceKm)}"></div></div>
 ${[['朝','breakfast'],['昼','lunch'],['夜','dinner'],['間食','snack'],['その他','other']].map(([n,k])=>`<div class="field"><label>${n}</label><textarea id="f-${k}">${esc(m[k]||'')}</textarea></div>`).join('')}
 <div class="field"><label>生活メモ</label><textarea id="f-life">${esc(r.lifeMemo||'')}</textarea></div>
 <div class="field"><label>ChatGPT振り返り</label><textarea id="f-summary">${esc(r.chatgptSummary||'')}</textarea></div>
 <div class="field"><label>AI評価</label><textarea id="f-review">${esc(r.aiReview||'')}</textarea></div>
 <div class="actions"><button class="btn primary" onclick="saveEdit('${date}')">保存</button><button class="btn" onclick="closeSheet()">閉じる</button></div></div>`)}
function saveEdit(date){const r=ensureDate(date);r.headline=v('f-headline');r.steps=v('f-steps');r.distanceKm=v('f-distance');r.meals={breakfast:v('f-breakfast'),lunch:v('f-lunch'),dinner:v('f-dinner'),snack:v('f-snack'),other:v('f-other')};r.lifeMemo=v('f-life');r.chatgptSummary=v('f-summary');r.aiReview=v('f-review');save();closeSheet();render();}
function openWeight(date){const now=new Date();const time=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;openSheet(`<h2>体重追加</h2><div class="form-grid"><div class="field"><label>体重 kg</label><input id="w-value" inputmode="decimal" placeholder="51.2"></div><div class="field"><label>時刻</label><input id="w-time" value="${time}"></div><div class="field"><label>メモ</label><input id="w-memo"></div><div class="actions"><button class="btn primary" onclick="saveWeight('${date}')">保存</button><button class="btn" onclick="closeSheet()">閉じる</button></div></div>`)}
function saveWeight(date){const r=ensureDate(date);const val=parseFloat(v('w-value'));if(Number.isNaN(val)){toast('体重を入力してね');return;}r.weights.push({time:v('w-time'),value:val,memo:v('w-memo')});save();closeSheet();render();}
function copyRecord(date){const r=ensureDate(date),w=latestWeight(r);const text=`【${r.date}】\n今日の一行：${r.headline||'—'}\n体重：${w?`${w.value}kg (${w.time})`:'—'}\n歩数：${r.steps||'—'}\n距離：${r.distanceKm||'—'}km\n\n食事\n朝：${r.meals.breakfast||'—'}\n昼：${r.meals.lunch||'—'}\n夜：${r.meals.dinner||'—'}\n間食：${r.meals.snack||'—'}\nその他：${r.meals.other||'—'}\n\n生活メモ\n${r.lifeMemo||'—'}\n\nChatGPT振り返り\n${r.chatgptSummary||'—'}\n\nAI評価\n${r.aiReview||'—'}`;navigator.clipboard.writeText(text).then(()=>toast('コピーしました'),()=>alert(text));}
function downloadJSON(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='data.json';a.click();URL.revokeObjectURL(a.href)}
function importJSON(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{data=JSON.parse(reader.result);save();currentDate=todayISO();ensureDate(currentDate);render();}catch(err){toast('読み込み失敗')}};reader.readAsText(file)}
function resetLocal(){if(confirm('ブラウザ保存を削除しますか？')){localStorage.removeItem(STORAGE_KEY);location.reload();}}
function openSheet(html){document.getElementById('sheet').innerHTML=html;document.getElementById('modal').classList.add('open')}function closeSheet(){document.getElementById('modal').classList.remove('open')}document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeSheet()});
function showView(id){document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===id));document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view===id));window.scrollTo({top:0,behavior:'smooth'});}document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>showView(t.dataset.view));
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1600)}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function attr(s){return esc(s).replace(/'/g,'&#39;')}function v(id){return document.getElementById(id)?.value||''}
load().then(()=>{ensureDate(todayISO());currentDate=todayISO();render();});
</script>
</body>
</html>
