<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>You & Me</title>
<style>
:root{--bg:#f7f4ee;--card:#fffdf8;--ink:#4a4742;--muted:#9b948a;--line:#ded6ca;--soft:#eee7dd;--accent:#4d4a45;--shadow:0 14px 32px rgba(91,78,61,.10)}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family: ui-serif, 'Hiragino Mincho ProN','Yu Mincho',serif;line-height:1.65;padding-bottom:92px} button,input,textarea,select{font:inherit} .app{max-width:720px;margin:0 auto;padding:64px 18px 24px}.hero{text-align:center;padding:58px 0 42px;border-bottom:1px solid var(--line)}.subtitle{letter-spacing:.22em;color:var(--muted);font-size:14px}.title{font-size:48px;line-height:1;margin:22px 0 28px;font-weight:700}.date{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;color:var(--muted);letter-spacing:.06em}.headline-label{margin-top:38px;color:var(--muted);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif}.headline{font-size:27px;margin-top:12px}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:28px 0}.btn{border:0;border-radius:999px;padding:12px 20px;background:var(--soft);color:var(--ink);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;font-weight:700}.btn.primary{background:var(--accent);color:#fff}.btn.small{padding:8px 14px;font-size:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px;margin:18px 0;box-shadow:var(--shadow)}.card h2{font-size:28px;margin:0 0 22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.stat{background:var(--soft);border-radius:20px;padding:18px;min-height:128px;font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif}.stat-label{color:var(--muted);font-size:14px}.stat-value{font-size:34px;font-weight:800;line-height:1.2;margin-top:12px}.stat-value small{font-size:16px;color:var(--muted)}.stat-sub{font-size:13px;color:var(--muted);margin-top:8px}.section-title{font-size:25px;margin:0 0 14px}.meal-row,.weight-row,.history-row{border-top:1px solid var(--line);padding:12px 0;white-space:pre-wrap}.meal-row:first-child,.weight-row:first-child,.history-row:first-child{border-top:0}.label{color:var(--muted);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;font-size:14px}.bottom-nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,253,248,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;gap:10px;padding:12px 10px calc(12px + env(safe-area-inset-bottom));z-index:10}.tab{border:0;background:transparent;padding:10px 18px;border-radius:999px;color:var(--muted);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;font-weight:700}.tab.active{background:var(--accent);color:white}.page{display:none}.page.active{display:block}.modal{position:fixed;inset:0;background:rgba(0,0,0,.28);display:none;align-items:flex-end;z-index:20}.modal.open{display:flex}.sheet{width:100%;max-width:720px;margin:0 auto;background:var(--card);border-radius:28px 28px 0 0;padding:22px 18px calc(24px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}.field{margin:14px 0}.field label{display:block;color:var(--muted);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;font-size:13px;margin-bottom:6px}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:16px;background:#fff;padding:12px;color:var(--ink)}textarea{min-height:90px;resize:vertical}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}.chart-wrap{overflow:hidden}.chart{width:100%;height:260px}.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--accent);color:#fff;border-radius:999px;padding:10px 18px;font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;display:none;z-index:40}.toast.show{display:block}.muted{color:var(--muted)}.copybox{white-space:pre-wrap;background:var(--soft);border-radius:18px;padding:16px;font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;font-size:14px}.danger{color:#9a5b55}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:420px){.title{font-size:44px}.headline{font-size:24px}.app{padding-left:18px;padding-right:18px}.grid{gap:12px}.stat{padding:16px}.stat-value{font-size:31px}.tab{padding:9px 14px}.card{padding:22px}}
</style>
</head>
<body>
<div class="app">
  <section class="page active" id="homePage"></section>
  <section class="page" id="graphPage"></section>
  <section class="page" id="historyPage"></section>
  <section class="page" id="settingsPage"></section>
</div>
<nav class="bottom-nav">
  <button class="tab active" data-page="homePage">ホーム</button><button class="tab" data-page="graphPage">グラフ</button><button class="tab" data-page="historyPage">履歴</button><button class="tab" data-page="settingsPage">設定</button>
</nav>
<div class="modal" id="editModal"><div class="sheet"><h2 id="modalTitle">編集</h2><div id="modalBody"></div><div class="actions"><button class="btn" id="closeModal">閉じる</button><button class="btn primary" id="saveModal">保存</button></div></div></div>
<div class="toast" id="toast">コピーしました</div>
<script>
const KEY='you-and-me-data-v7';
let data=null; let currentDate=null; let modalMode=null;
const todayISO=()=>{const d=new Date(); const off=d.getTimezoneOffset(); return new Date(d.getTime()-off*60000).toISOString().slice(0,10)};
const fmtDate=d=>{const x=new Date(d+'T00:00:00'); return `${x.getFullYear()}.${String(x.getMonth()+1).padStart(2,'0')}.${String(x.getDate()).padStart(2,'0')} ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][x.getDay()]}`};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const nl=s=>esc(s||'—').replace(/\n/g,'<br>');
function blankRecord(date){return {date,headline:'',weights:[],steps:'',distanceKm:'',meals:{breakfast:'',lunch:'',dinner:'',snack:'',other:''},lifeMemo:'',chatgptSummary:'',aiReview:''}}
async function init(){const saved=localStorage.getItem(KEY); if(saved){data=JSON.parse(saved)} else {try{const r=await fetch('data.json',{cache:'no-store'}); data=await r.json()}catch(e){data={appName:'You & Me',subtitle:'a small record of ordinary days',settings:{icons:{today:'☁️',weight:'⚖️',steps:'👣',distance:'🚶‍♀️',meals:'🍴',memo:'📝',review:'🤖'}},records:[]}} save(false)} const t=todayISO(); currentDate=t; ensureRecord(t); render(); bindTabs();}
function save(renderAfter=true){localStorage.setItem(KEY,JSON.stringify(data)); if(renderAfter) render()}
function records(){return data.records.sort((a,b)=>a.date.localeCompare(b.date))}
function getRecord(date=currentDate){return data.records.find(r=>r.date===date)}
function ensureRecord(date){let r=getRecord(date); if(!r){r=blankRecord(date); data.records.push(r); save(false)} return r}
function lastWeight(r){return (r.weights&&r.weights.length)? r.weights[r.weights.length-1]:null}
function firstWeight(r){return (r.weights&&r.weights.length)? r.weights[0]:null}
function render(){renderHome(); renderGraph(); renderHistory(); renderSettings()}
function hero(r,title='You & Me',sub='a small record of ordinary days'){return `<div class="hero"><div class="subtitle">${esc(sub)}</div><div class="title">${esc(title)}</div><div class="date">${fmtDate(r.date)}</div><div class="headline-label">今日の一行</div><div class="headline">“${esc(r.headline||'まだ書いていない')}”</div></div>`}
function renderHome(){const r=ensureRecord(currentDate); const w=lastWeight(r); document.getElementById('homePage').innerHTML=`${hero(r,data.appName,data.subtitle)}<div class="toolbar"><button class="btn primary" onclick="openEdit('day')">今日を編集</button><button class="btn" onclick="openEdit('weight')">体重追加</button><button class="btn" onclick="copyText(exportText(getRecord()))">全文コピー</button></div><div class="card"><h2>${data.settings.icons.weight} 今日の記録</h2><div class="grid"><div class="stat"><div class="stat-label">体重</div><div class="stat-value">${w?esc(w.value):'—'} <small>kg</small></div><div class="stat-sub">${w?`${esc(r.date)}<br>${esc(w.time)}`:''}</div></div><div class="stat"><div class="stat-label">歩数</div><div class="stat-value">${r.steps?Number(r.steps).toLocaleString():'—'} <small>steps</small></div></div><div class="stat"><div class="stat-label">距離</div><div class="stat-value">${r.distanceKm||'—'} <small>km</small></div></div><div class="stat"><div class="stat-label">体重変化</div><div class="stat-value">${weightChangeText()}</div><div class="stat-sub">5/1から</div></div></div></div><div class="card"><h2>${data.settings.icons.weight} 体重</h2>${(r.weights||[]).map(x=>`<div class="weight-row"><b>${esc(x.time)}</b>　${esc(x.value)}kg ${x.memo?`<span class="muted">${esc(x.memo)}</span>`:''}</div>`).join('')||'<p class="muted">まだ記録がありません。</p>'}</div><div class="card"><h2>${data.settings.icons.meals} 今日の食事</h2>${mealHtml(r)}</div><div class="card"><h2>${data.settings.icons.memo} 生活メモ</h2><p>${nl(r.lifeMemo)}</p></div><div class="card"><h2>ChatGPT振り返り</h2><p>${nl(r.chatgptSummary)}</p></div><div class="card"><h2>${data.settings.icons.review} AI評価</h2><p>${nl(r.aiReview)}</p></div>`}
function mealHtml(r){const m=r.meals||{}; const labs={breakfast:'朝',lunch:'昼',dinner:'夜',snack:'間食',other:'その他'}; return Object.keys(labs).map(k=>`<div class="meal-row"><span class="label">${labs[k]}</span><br>${nl(m[k])}</div>`).join('')}
function weightChangeText(){const rs=records().filter(r=>lastWeight(r)); if(rs.length<2)return '—'; const first=lastWeight(rs[0]).value, last=lastWeight(rs[rs.length-1]).value; const diff=(last-first).toFixed(1); return `${diff>0?'+':''}${diff}<small> kg</small>`}
function chartPoints(){return records().filter(r=>lastWeight(r)).map(r=>({date:r.date,value:Number(lastWeight(r).value)}))}
function renderGraph(){const pts=chartPoints(); let svg='<p class="muted">記録が足りません。</p>'; if(pts.length){const vals=pts.map(p=>p.value); let min=Math.floor(Math.min(...vals))-1, max=Math.ceil(Math.max(...vals))+1; if(min===max){min-=1;max+=1} const W=620,H=260,pad=42, iw=W-pad*2, ih=H-pad*2; const x=i=>pts.length===1?pad+iw/2:pad+(iw*i/(pts.length-1)); const y=v=>pad+((max-v)/(max-min))*ih; const line=pts.map((p,i)=>`${i?'L':'M'}${x(i)},${y(p.value)}`).join(' '); const circles=pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.value)}" r="5" fill="#4a4742"/><text x="${x(i)}" y="${y(p.value)-12}" text-anchor="middle" font-size="16" fill="#4a4742">${p.value}</text><text x="${x(i)}" y="${H-12}" text-anchor="middle" font-size="13" fill="#9b948a">${p.date.slice(5).replace('-','/')}</text>`).join(''); const grid=[0,.25,.5,.75,1].map(t=>{const yy=pad+t*ih; const val=(max-t*(max-min)).toFixed(0); return `<line x1="${pad}" y1="${yy}" x2="${W-pad}" y2="${yy}" stroke="#ded6ca"/><text x="8" y="${yy+4}" font-size="12" fill="#9b948a">${val}</text>`}).join(''); svg=`<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${grid}<path d="${line}" fill="none" stroke="#4a4742" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>${circles}</svg>`} document.getElementById('graphPage').innerHTML=`<div class="hero"><div class="subtitle">weight graph</div><div class="title">Graph</div></div><div class="card chart-wrap">${svg}</div><div class="card"><h2>体重ログ</h2>${pts.map(p=>`<div class="weight-row">${p.date}：${p.value}kg</div>`).join('')||'<p class="muted">なし</p>'}</div>`}
function renderHistory(){const rs=[...records()].sort((a,b)=>b.date.localeCompare(a.date)); document.getElementById('historyPage').innerHTML=`<div class="hero"><div class="subtitle">ordinary days</div><div class="title">History</div></div><div class="toolbar"><button class="btn primary" onclick="createDatePrompt()">新しい日付</button></div><div class="card">${rs.map(r=>`<div class="history-row" onclick="currentDate='${r.date}'; showPage('homePage')"><b>${esc(r.date)}</b><br>${esc(r.headline||'まだ書いていない')}</div>`).join('')}</div>`}
function renderSettings(){document.getElementById('settingsPage').innerHTML=`<div class="hero"><div class="subtitle">settings and backup</div><div class="title">Settings</div></div><div class="card"><h2>データ</h2><div class="actions" style="justify-content:flex-start;flex-wrap:wrap"><button class="btn" onclick="downloadData()">data.json保存</button><label class="btn">data.json読込<input type="file" accept="application/json" style="display:none" onchange="importData(event)"></label><button class="btn" onclick="copyText(JSON.stringify(data,null,2))">JSONコピー</button></div><p class="muted">編集内容はブラウザに保存されます。GitHubのdata.jsonへ反映する場合は、保存したdata.jsonをリポジトリへ上げ直してください。</p></div><div class="card"><h2>ChatGPT用コピー</h2><div class="copybox">${esc(exportText(getRecord()))}</div><div class="toolbar"><button class="btn primary" onclick="copyText(exportText(getRecord()))">全文コピー</button></div></div><div class="card"><h2>危険操作</h2><button class="btn danger" onclick="if(confirm('ブラウザ保存を削除しますか？')){localStorage.removeItem(KEY);location.reload()} ">ローカルデータ初期化</button></div>`}
function openEdit(mode){modalMode=mode; const r=ensureRecord(currentDate); const body=document.getElementById('modalBody'); document.getElementById('modalTitle').textContent=mode==='weight'?'体重追加':'今日を編集'; if(mode==='weight'){const now=new Date(); const time=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`; body.innerHTML=`<div class="field"><label>日付</label><input id="wDate" type="date" value="${currentDate}"></div><div class="field"><label>時刻</label><input id="wTime" type="time" value="${time}"></div><div class="field"><label>体重 kg</label><input id="wValue" type="number" step="0.1" placeholder="51.2"></div><div class="field"><label>メモ</label><input id="wMemo" placeholder="任意"></div>`}else{const m=r.meals||{}; body.innerHTML=`<div class="field"><label>日付</label><input id="dDate" type="date" value="${r.date}"></div><div class="field"><label>今日の一行</label><input id="headline" value="${esc(r.headline||'')}"></div><div class="two"><div class="field"><label>歩数</label><input id="steps" type="number" value="${esc(r.steps||'')}"></div><div class="field"><label>距離 km</label><input id="distance" type="number" step="0.1" value="${esc(r.distanceKm||'')}"></div></div><div class="field"><label>朝</label><textarea id="breakfast">${esc(m.breakfast||'')}</textarea></div><div class="field"><label>昼</label><textarea id="lunch">${esc(m.lunch||'')}</textarea></div><div class="field"><label>夜</label><textarea id="dinner">${esc(m.dinner||'')}</textarea></div><div class="field"><label>間食</label><textarea id="snack">${esc(m.snack||'')}</textarea></div><div class="field"><label>その他</label><textarea id="other">${esc(m.other||'')}</textarea></div><div class="field"><label>生活メモ</label><textarea id="lifeMemo">${esc(r.lifeMemo||'')}</textarea></div><div class="field"><label>ChatGPT振り返り</label><textarea id="chatgptSummary">${esc(r.chatgptSummary||'')}</textarea></div><div class="field"><label>AI評価</label><textarea id="aiReview">${esc(r.aiReview||'')}</textarea></div>`} document.getElementById('editModal').classList.add('open')}
document.getElementById('closeModal').onclick=()=>document.getElementById('editModal').classList.remove('open');
document.getElementById('saveModal').onclick=()=>{if(modalMode==='weight'){const date=document.getElementById('wDate').value||currentDate; const r=ensureRecord(date); const v=parseFloat(document.getElementById('wValue').value); if(!v){alert('体重を入力してね');return} r.weights.push({time:document.getElementById('wTime').value,value:v,memo:document.getElementById('wMemo').value}); r.weights.sort((a,b)=>a.time.localeCompare(b.time)); currentDate=date}else{const old=getRecord(currentDate); const newDate=document.getElementById('dDate').value||currentDate; old.date=newDate; old.headline=document.getElementById('headline').value; old.steps=document.getElementById('steps').value; old.distanceKm=document.getElementById('distance').value; old.meals={breakfast:val('breakfast'),lunch:val('lunch'),dinner:val('dinner'),snack:val('snack'),other:val('other')}; old.lifeMemo=val('lifeMemo'); old.chatgptSummary=val('chatgptSummary'); old.aiReview=val('aiReview'); currentDate=newDate} document.getElementById('editModal').classList.remove('open'); save(true)};
function val(id){return document.getElementById(id).value}
function createDatePrompt(){const d=prompt('作成する日付 YYYY-MM-DD', todayISO()); if(!d)return; currentDate=d; ensureRecord(d); showPage('homePage')}
function exportText(r){r=r||getRecord(); const w=(r.weights||[]).map(x=>`${x.value}kg (${x.time})`).join(' / ')||'—'; const m=r.meals||{}; return `【${r.date}】\n今日の一行：${r.headline||'—'}\n体重：${w}\n歩数：${r.steps||'—'}\n距離：${r.distanceKm||'—'}km\n\n食事\n朝：${m.breakfast||'—'}\n昼：${m.lunch||'—'}\n夜：${m.dinner||'—'}\n間食：${m.snack||'—'}\nその他：${m.other||'—'}\n\n生活メモ\n${r.lifeMemo||'—'}\n\nChatGPT振り返り\n${r.chatgptSummary||'—'}\n\nAI評価\n${r.aiReview||'—'}\n`;}
function copyText(text){navigator.clipboard?.writeText(text).then(()=>toast('コピーしました')).catch(()=>{prompt('コピーしてね',text)})}
function toast(t){const el=document.getElementById('toast'); el.textContent=t; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),1600)}
function downloadData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='data.json'; a.click(); URL.revokeObjectURL(a.href)}
function importData(e){const f=e.target.files[0]; if(!f)return; const reader=new FileReader(); reader.onload=()=>{try{data=JSON.parse(reader.result); save(false); currentDate=todayISO(); ensureRecord(currentDate); render(); toast('読み込みました')}catch(err){alert('JSONを読み込めませんでした')}}; reader.readAsText(f)}
function bindTabs(){document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>showPage(b.dataset.page))}
function showPage(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active')); document.getElementById(id).classList.add('active'); document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.page===id)); render()}
init();
</script>
</body>
</html>
