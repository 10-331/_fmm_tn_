<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>You & Me</title>
<style>
:root{
  --bg:#F7F4EE; --card:#FFFDF8; --ink:#4A4742; --muted:#8B8378; --soft:#EFE8DF; --line:#DED5C9; --accent:#4A4742;
  --shadow:0 10px 26px rgba(88,78,66,.08);
}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Mincho ProN","Yu Mincho",serif;line-height:1.65;padding-bottom:92px} button,input,textarea,select{font:inherit;color:inherit} button{border:0;cursor:pointer} .wrap{max-width:760px;margin:0 auto;padding:44px 18px 120px}.hero{text-align:center;padding:30px 0 34px}.sub{font-size:14px;letter-spacing:.22em;color:var(--muted);margin-bottom:20px}.title{font-size:48px;line-height:1;font-weight:700;letter-spacing:.02em;margin:0 0 32px}.date{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;font-size:18px;color:var(--muted);letter-spacing:.08em;margin-bottom:34px}.label{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;color:var(--muted);font-size:14px;margin-bottom:14px}.headline{font-size:28px;line-height:1.5;margin:0 auto;max-width:640px}.rule{height:1px;background:var(--line);margin:34px 0 24px}.actions{display:flex;gap:12px;margin:0 0 24px}.pill{border-radius:999px;padding:12px 22px;background:var(--soft);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;font-weight:700}.pill.primary{background:var(--accent);color:white}.card{background:rgba(255,253,248,.88);border:1px solid var(--line);border-radius:24px;padding:24px 22px;margin:22px 0;box-shadow:var(--shadow)}.card h2{margin:0 0 20px;font-size:28px;line-height:1.2}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.metric{background:var(--soft);border-radius:20px;padding:16px;min-height:120px;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}.metric .k{color:var(--muted);font-size:14px;margin-bottom:10px}.metric .v{font-size:34px;font-weight:800;letter-spacing:.02em;line-height:1.1}.metric .unit{font-size:16px;color:var(--muted);font-weight:700;margin-left:4px}.metric .note{font-size:14px;color:var(--muted);margin-top:8px}.section-line{border-top:1px solid var(--line);padding-top:16px;margin-top:16px}.meal-row,.weight-row,.history-row{border-top:1px solid var(--line);padding:12px 0;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}.meal-row:first-child,.weight-row:first-child,.history-row:first-child{border-top:0}.meal-type{color:var(--muted);font-size:13px;margin-bottom:4px}.memo{white-space:pre-wrap;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,253,248,.92);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:12px 18px calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:10px}.nav button{min-width:72px;border-radius:999px;padding:10px 14px;background:transparent;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;font-weight:700;color:var(--muted)}.nav button.active{background:var(--accent);color:#fff}.modal{position:fixed;inset:0;background:rgba(0,0,0,.28);display:none;align-items:flex-end;z-index:10}.modal.show{display:flex}.sheet{background:var(--card);width:100%;max-width:760px;margin:0 auto;border-radius:28px 28px 0 0;padding:22px 18px calc(26px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}.sheet h3{font-size:24px;margin:0 0 16px}.field{margin:14px 0;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}.field label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#fff;border-radius:16px;padding:12px 14px;font-size:16px}.field textarea{min-height:90px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sheet-actions{display:flex;gap:10px;margin-top:18px}.sheet-actions button{flex:1}.hide{display:none}.tiny{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;color:var(--muted);font-size:13px}.danger{background:#8d3a36!important;color:#fff!important}.chart{width:100%;height:230px;background:#fff;border-radius:18px;border:1px solid var(--line);padding:10px}.linkbtn{background:transparent;text-decoration:underline;color:var(--ink);padding:0}.empty{color:var(--muted);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}.exportbox{width:100%;min-height:180px;border:1px solid var(--line);border-radius:16px;padding:12px;background:#fff;font-family:ui-monospace,Menlo,monospace;font-size:13px;white-space:pre-wrap;overflow:auto}
@media (max-width:420px){.title{font-size:46px}.headline{font-size:25px}.grid{gap:12px}.metric{min-height:112px}.metric .v{font-size:31px}.card{padding:22px 18px}.card h2{font-size:26px}}
</style>
</head>
<body>
<div class="wrap">
  <section id="homeView"></section>
  <section id="graphView" class="hide"></section>
  <section id="historyView" class="hide"></section>
  <section id="settingsView" class="hide"></section>
</div>
<nav class="nav">
  <button data-view="home" class="active">ホーム</button><button data-view="graph">グラフ</button><button data-view="history">履歴</button><button data-view="settings">設定</button>
</nav>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<script>
const KEY='youAndMe.logs.v4';
const ICONKEY='youAndMe.icons.v4';
const todayISO=()=>{const d=new Date(); const z=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`};
const nowTime=()=>{const d=new Date(); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};
const fmtDate=(iso)=>{const d=new Date(iso+'T00:00:00'); return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()]}`};
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
const defaultIcons={headline:'',record:'⚖️',weight:'⚖️',steps:'👣',distance:'🚶‍♀️',meals:'🍴',memo:'📝',review:'🤖'};
const sample=[
{date:'2026-05-01',headline:'まだ知らない部屋のことを考えていた',weights:[{id:uid(),time:'07:00',value:57.0,memo:''}],steps:'',distance:'',meals:{breakfast:'',lunch:'',dinner:'',snack:'',other:''},lifeMemo:'新生活の準備はまだこれから。今の暮らしを続けながら、これからどうなるんだろうと考えていた頃。',chatSummary:'',aiReview:''},
{date:'2026-06-13',headline:'夜風が気持ちよかった',weights:[{id:uid(),time:'21:30',value:51.3,memo:''}],steps:'16000',distance:'10.4',meals:{breakfast:'',lunch:'',dinner:'えび餃子4個\nミニトマト7個',snack:'',other:''},lifeMemo:'チークとハイライトを購入。ニトリでキッチンマットを購入。ソファのある暮らしに憧れた。夜風が気持ちよかった。',chatSummary:'・モールとニトリへ行った\n・チークとハイライトを購入\n・おにぎりケースとキッチンマットを購入\n・16,000歩歩いた\n・You & Me の構想が生まれた',aiReview:'活動量が非常に多い日。食事は軽め。翌日は脚の疲れやむくみの可能性あり。'}
];
let logs=loadLogs(); let icons=loadIcons(); let currentDate=latestDate();
function loadLogs(){try{const raw=localStorage.getItem(KEY); if(raw)return JSON.parse(raw)}catch(e){} return sample}
function saveLogs(){localStorage.setItem(KEY,JSON.stringify(logs))}
function loadIcons(){try{return {...defaultIcons,...JSON.parse(localStorage.getItem(ICONKEY)||'{}')}}catch(e){return defaultIcons}}
function saveIcons(){localStorage.setItem(ICONKEY,JSON.stringify(icons))}
function latestDate(){return logs.map(l=>l.date).sort().at(-1)||todayISO()}
function getLog(date=currentDate){let l=logs.find(x=>x.date===date); if(!l){l={date,headline:'',weights:[],steps:'',distance:'',meals:{breakfast:'',lunch:'',dinner:'',snack:'',other:''},lifeMemo:'',chatSummary:'',aiReview:''}; logs.push(l); saveLogs()} return l}
function lastWeight(log){return [...(log.weights||[])].sort((a,b)=>a.time.localeCompare(b.time)).at(-1)}
function firstWeight(log){return [...(log.weights||[])].sort((a,b)=>a.time.localeCompare(b.time))[0]}
function weightChangeFromMay(log){const base=logs.find(l=>l.date==='2026-05-01'); const bw=base&&lastWeight(base); const w=lastWeight(log); if(!bw||!w)return '—'; const diff=(w.value-bw.value).toFixed(1); return `${diff>0?'+':''}${diff} kg`}
function showView(name){document.querySelectorAll('.wrap>section').forEach(s=>s.classList.add('hide')); document.getElementById(name+'View').classList.remove('hide'); document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===name)); render()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>showView(b.dataset.view));
function render(){renderHome();renderGraph();renderHistory();renderSettings()}
function renderHome(){const l=getLog(); const w=lastWeight(l); document.getElementById('homeView').innerHTML=`
  <div class="hero"><div class="sub">a small record of ordinary days</div><h1 class="title">You & Me</h1><div class="date">${fmtDate(l.date)}</div><div class="label">今日の一行</div><p class="headline">“${esc(l.headline||'まだ書かれていません')}”</p></div>
  <div class="rule"></div><div class="actions"><button class="pill primary" onclick="openEditDay('${l.date}')">今日を編集</button><button class="pill" onclick="openAddWeight('${l.date}')">体重追加</button></div>
  <div class="card"><h2>${icons.record} 今日の記録</h2><div class="grid">
    <div class="metric"><div class="k">体重</div><div class="v">${w?Number(w.value).toFixed(1):'—'}<span class="unit">kg</span></div><div class="note">${w?`${l.date}<br>${w.time}`:''}</div></div>
    <div class="metric"><div class="k">歩数</div><div class="v">${l.steps?Number(l.steps).toLocaleString():'—'}<span class="unit">steps</span></div></div>
    <div class="metric"><div class="k">距離</div><div class="v">${l.distance||'—'}<span class="unit">km</span></div></div>
    <div class="metric"><div class="k">体重変化</div><div class="v">${weightChangeFromMay(l)}</div><div class="note">5/1から</div></div>
  </div></div>
  <div class="card"><h2>${icons.weight} 体重</h2>${renderWeights(l)}<button class="pill" onclick="openAddWeight('${l.date}')">＋追加</button></div>
  <div class="card"><h2>${icons.meals} 今日の食事</h2>${renderMeals(l)}</div>
  <div class="card"><h2>${icons.memo} 生活メモ</h2><div class="memo">${esc(l.lifeMemo)||'<span class="empty">—</span>'}</div></div>
  <div class="card"><h2>ChatGPT振り返り</h2><div class="memo">${esc(l.chatSummary)||'<span class="empty">—</span>'}</div></div>
  <div class="card"><h2>${icons.review} AI評価</h2><div class="memo">${esc(l.aiReview)||'<span class="empty">—</span>'}</div></div>
`}
function renderWeights(l){if(!l.weights||!l.weights.length)return '<p class="empty">まだありません</p>';return [...l.weights].sort((a,b)=>a.time.localeCompare(b.time)).map(w=>`<div class="weight-row"><b>${esc(w.time)}</b>　${Number(w.value).toFixed(1)} kg ${w.memo?`<div class="tiny">${esc(w.memo)}</div>`:''} <button class="linkbtn" onclick="openEditWeight('${l.date}','${w.id}')">編集</button></div>`).join('')}
function renderMeals(l){const names={breakfast:'朝',lunch:'昼',dinner:'夜',snack:'間食',other:'その他'};return Object.keys(names).map(k=>`<div class="meal-row"><div class="meal-type">${names[k]}</div><div class="memo">${esc(l.meals?.[k])||'<span class="empty">—</span>'}</div></div>`).join('')}
function renderGraph(){const data=logs.map(l=>({date:l.date,w:firstWeight(l)?.value})).filter(x=>x.w).sort((a,b)=>a.date.localeCompare(b.date)); let svg='<p class="empty">体重記録が足りません</p>'; if(data.length>=2){const W=680,H=220,p=28; const vals=data.map(d=>d.w); const min=Math.min(...vals)-.5,max=Math.max(...vals)+.5; const pts=data.map((d,i)=>{const x=p+i*(W-2*p)/(data.length-1); const y=H-p-(d.w-min)*(H-2*p)/(max-min); return {x,y,d}}); svg=`<svg viewBox="0 0 ${W} ${H}" class="chart" role="img"><polyline fill="none" stroke="#4A4742" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" points="${pts.map(p=>p.x+','+p.y).join(' ')}"/>${pts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="6" fill="#4A4742"/>`).join('')}<text x="${p}" y="${H-6}" font-size="22" fill="#8B8378">${data[0].date}</text><text x="${W-p-112}" y="${H-6}" font-size="22" fill="#8B8378">${data.at(-1).date}</text></svg>`}
 document.getElementById('graphView').innerHTML=`<div class="hero"><div class="sub">You & Me</div><h1 class="title">Graph</h1></div><div class="card"><h2>体重推移</h2>${svg}</div>`}
function renderHistory(){const rows=[...logs].sort((a,b)=>b.date.localeCompare(a.date)).map(l=>`<div class="history-row" onclick="currentDate='${l.date}';showView('home')"><b>${fmtDate(l.date)}</b><br><span class="tiny">${esc(l.headline||'—')}</span></div>`).join(''); document.getElementById('historyView').innerHTML=`<div class="hero"><div class="sub">You & Me</div><h1 class="title">History</h1></div><div class="card"><h2>履歴</h2>${rows}</div>`}
function renderSettings(){document.getElementById('settingsView').innerHTML=`<div class="hero"><div class="sub">You & Me</div><h1 class="title">Settings</h1></div><div class="card"><h2>データ</h2><button class="pill" onclick="openExport()">ChatGPT用出力 / JSON</button><button class="pill" onclick="openImport()">JSONインポート</button></div><div class="card"><h2>アイコン</h2>${Object.keys(defaultIcons).map(k=>`<div class="field"><label>${k}</label><input value="${esc(icons[k]||'')}" onchange="icons['${k}']=this.value;saveIcons();render()"></div>`).join('')}</div>`}
function openEditDay(date){const l=getLog(date); openSheet(`<h3>${fmtDate(date)} を編集</h3><div class="field"><label>今日の一行</label><input id="f_headline" value="${escAttr(l.headline)}"></div><div class="row"><div class="field"><label>歩数</label><input id="f_steps" inputmode="numeric" value="${escAttr(l.steps)}"></div><div class="field"><label>距離 km</label><input id="f_distance" inputmode="decimal" value="${escAttr(l.distance)}"></div></div><div class="field"><label>朝</label><textarea id="f_breakfast">${esc(l.meals.breakfast)}</textarea></div><div class="field"><label>昼</label><textarea id="f_lunch">${esc(l.meals.lunch)}</textarea></div><div class="field"><label>夜</label><textarea id="f_dinner">${esc(l.meals.dinner)}</textarea></div><div class="field"><label>間食</label><textarea id="f_snack">${esc(l.meals.snack)}</textarea></div><div class="field"><label>その他</label><textarea id="f_other">${esc(l.meals.other)}</textarea></div><div class="field"><label>生活メモ</label><textarea id="f_life">${esc(l.lifeMemo)}</textarea></div><div class="field"><label>ChatGPT振り返り</label><textarea id="f_chat">${esc(l.chatSummary)}</textarea></div><div class="field"><label>AI評価</label><textarea id="f_ai">${esc(l.aiReview)}</textarea></div><div class="sheet-actions"><button class="pill" onclick="closeSheet()">閉じる</button><button class="pill primary" onclick="saveDay('${date}')">保存</button></div>`)}
function saveDay(date){const l=getLog(date); l.headline=val('f_headline'); l.steps=val('f_steps'); l.distance=val('f_distance'); l.meals={breakfast:val('f_breakfast'),lunch:val('f_lunch'),dinner:val('f_dinner'),snack:val('f_snack'),other:val('f_other')}; l.lifeMemo=val('f_life'); l.chatSummary=val('f_chat'); l.aiReview=val('f_ai'); saveLogs(); closeSheet(); render()}
function openAddWeight(date){openSheet(`<h3>体重を追加</h3><div class="row"><div class="field"><label>体重 kg</label><input id="w_value" inputmode="decimal" placeholder="51.3"></div><div class="field"><label>時刻</label><input id="w_time" type="time" value="${nowTime()}"></div></div><div class="field"><label>メモ</label><input id="w_memo"></div><div class="sheet-actions"><button class="pill" onclick="closeSheet()">閉じる</button><button class="pill primary" onclick="saveWeight('${date}')">保存</button></div>`)}
function openEditWeight(date,id){const l=getLog(date); const w=l.weights.find(x=>x.id===id); if(!w)return; openSheet(`<h3>体重を編集</h3><div class="row"><div class="field"><label>体重 kg</label><input id="w_value" inputmode="decimal" value="${w.value}"></div><div class="field"><label>時刻</label><input id="w_time" type="time" value="${w.time}"></div></div><div class="field"><label>メモ</label><input id="w_memo" value="${escAttr(w.memo||'')}"></div><div class="sheet-actions"><button class="pill danger" onclick="deleteWeight('${date}','${id}')">削除</button><button class="pill primary" onclick="saveWeight('${date}','${id}')">保存</button></div>`)}
function saveWeight(date,id=null){const l=getLog(date); const value=parseFloat(val('w_value')); if(!value){alert('体重を入力してね');return} const obj={id:id||uid(),time:val('w_time')||nowTime(),value,memo:val('w_memo')}; if(id){const i=l.weights.findIndex(x=>x.id===id); l.weights[i]=obj}else l.weights.push(obj); saveLogs(); closeSheet(); render()}
function deleteWeight(date,id){const l=getLog(date); l.weights=l.weights.filter(x=>x.id!==id); saveLogs(); closeSheet(); render()}
function openExport(){const text=makeSummary(getLog()); openSheet(`<h3>出力</h3><div class="field"><label>ChatGPTに貼る用</label><div class="exportbox">${esc(text)}</div></div><div class="field"><label>JSONバックアップ</label><div class="exportbox">${esc(JSON.stringify(logs,null,2))}</div></div><div class="sheet-actions"><button class="pill primary" onclick="closeSheet()">閉じる</button></div>`)}
function openImport(){openSheet(`<h3>JSONインポート</h3><div class="field"><label>バックアップJSON</label><textarea id="import_json" placeholder='[ ... ]'></textarea></div><div class="sheet-actions"><button class="pill" onclick="closeSheet()">閉じる</button><button class="pill primary" onclick="doImport()">読み込む</button></div>`)}
function doImport(){try{const data=JSON.parse(val('import_json')); if(!Array.isArray(data))throw new Error(); logs=data; saveLogs(); currentDate=latestDate(); closeSheet(); render()}catch(e){alert('JSONを確認してね')}}
function makeSummary(l){const w=lastWeight(l);return `【${l.date}】\n今日の一行：${l.headline||'—'}\n体重：${w?`${w.value}kg (${w.time})`:'—'}\n歩数：${l.steps||'—'}\n距離：${l.distance||'—'}km\n\n食事\n朝：${l.meals.breakfast||'—'}\n昼：${l.meals.lunch||'—'}\n夜：${l.meals.dinner||'—'}\n間食：${l.meals.snack||'—'}\nその他：${l.meals.other||'—'}\n\n生活メモ\n${l.lifeMemo||'—'}\n\nChatGPT振り返り\n${l.chatSummary||'—'}\n\nAI評価\n${l.aiReview||'—'}`}
function openSheet(html){document.getElementById('sheet').innerHTML=html;document.getElementById('modal').classList.add('show')}
function closeSheet(){document.getElementById('modal').classList.remove('show')}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeSheet()});
function val(id){return document.getElementById(id)?.value||''}
function esc(s=''){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function escAttr(s=''){return esc(s).replace(/"/g,'&quot;')}
render();
</script>
</body></html>
